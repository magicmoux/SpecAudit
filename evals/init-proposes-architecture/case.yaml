schema_version: "1.1"
name: init-proposes-architecture
description: >-
  /spec-audit:init, where no question can be asked, on a project with an original manuscript and hard-to-find
  references (source/), a revised version with its proofs (artifacts/) and a Lean development with a correspondence
  table (mechanization/): it prints the proposal with each path's expected role, the oracle's command, correspondence
  table and guard location, and the mapped pair, and writes nothing.
tags: [init, architecture, shell]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Skill, Write, Edit]
  prompt: "/spec-audit:init"
graders:
  - name: runs-the-scan
    type: tool_used
    tool: Bash
    input_match: 'scan\.py'
  - name: nothing-written
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-commit
    type: tool_used
    tool: Bash
    input_match: 'git[^\n]*\bcommit\b'
    min: 0
    max: 0
  - name: artifacts-audited-formal
    type: regex
    pattern: '`?artifacts/`?\s*\|\s*audited\s*\|\s*formal'
  - name: manuscript-original
    type: regex
    pattern: '`?source/manuscript\.md`?\s*\|\s*original\b'
  - name: references-sources
    type: regex
    pattern: '`?source/references/`?\s*\|\s*sources\b'
  - name: mechanization-oracle
    type: regex
    pattern: '`?mechanization/`?\s*\|\s*oracle\b'
  - name: lean-command-table-and-guards
    type: regex
    pattern: 'lake -d mechanization build[\s\S]*mechanization/CORRESPONDENCE\.md[\s\S]*mechanization/Guards/'
  - name: mapped-pair
    type: regex
    pattern: 'artifacts/manuscript-revised\.md`?\s*\|[^\n]*mechanization/Selection'
  - name: says-nothing-written
    type: llm
    criteria: >-
      The answer presents the proposed architecture and says that SPECAUDIT_ARCH.md was not written because no question
      could be asked, and that /spec-audit:init must be run interactively (or the file written by hand) before an audit.
