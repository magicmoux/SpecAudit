schema_version: "1.1"
name: e2e-demo-in-session
description: >-
  Full audit of the demo in the session itself (--in-session --no-worktree --keep, one iteration): register, inventory
  and report are written, Lemma 3 is fixed with a guard written red first, Proposition 4 is left unchanged.
tags: [e2e, shell]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 200
  timeout_seconds: 3600
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Agent, Skill]
  prompt: "/spec-audit:start selection.md --in-session --no-worktree --max-iter 1 --keep"
graders:
  - name: register-written
    type: file_exists
    path: "spec-audit/selection/register.md"
  - name: inventory-written
    type: file_exists
    path: "spec-audit/selection/inventory.md"
  - name: report-written
    type: file_exists
    path: "spec-audit/selection/report.md"
  - name: lemma-3-fixed
    type: regex
    target: { source: file, path: selection.md }
    # Anchored on the statement of Lemma 3: Definition 2 already contains min(k, n), so an unanchored pattern passes
    # on the untouched document.
    pattern: '\*\*Lemma 3\.\*\*[^\n]*(min\(k, ?\|L\|\)|min\(k, ?n\)|k ≤ \|L\||k ≤ n)'
  - name: proposition-4-unchanged
    type: regex
    target: { source: file, path: selection.md }
    pattern: 'P_k\(L \+\+ M\) = P_k\(P_k\(L\) \+\+ P_k\(M\)\)'
  - name: guard-red-first
    type: regex
    target: { source: file, path: spec-audit/selection/register.md }
    # Whole word: a bare 'red' also matches "ignored" or "recorded", which every register contains.
    pattern: '\bred\b'
    flags: i
  - name: agent-table
    type: regex
    target: { source: file, path: spec-audit/selection/register.md }
    pattern: 'audit-selection-(reviewer|adjudicator)'
  # The results folder is named by the launch time, which a file_exists path cannot predict: the register records its
  # path at closing; evals/local-e2e.sh checks the folder's contents on disk.
  - name: results-folder-recorded
    type: regex
    target: { source: file, path: spec-audit/selection/register.md }
    pattern: 'results folder:? `?SpecAudit-\d{8}_\d{4}(-\d+)?/'
    flags: i
  - name: index-row
    type: regex
    target: { source: file, path: SPECAUDITS.md }
    pattern: 'SpecAudit-\d{8}_\d{4}[^\n]*selection\.md'
  - name: report-quality
    type: llm
    focus: { source: file, path: spec-audit/selection/report.md }
    criteria: >-
      The report has the sections Result, Cause graph, Modified statements, Errors, Open points, Corpus and Scope of
      verification (other sections may be present too). It reports Lemma 3 as a confirmed error that was fixed, its
      new statement giving the length as the minimum of k and the length of L, or adding the hypothesis that k does
      not exceed the length of L, in any notation or spacing. It never states that the document, or a part of it, is
      correct or verified without saying by what.
  # The structure is checked by regex: a judge reading the whole report is noisy on it.
  - name: summary-of-issues-last
    type: regex
    target: { source: file, path: spec-audit/selection/report.md }
    pattern: '## Summary of issues\s*\n\|[^\n]*Priority(?![\s\S]*\n## )'
  - name: summary-of-issues-content
    type: llm
    focus: { source: file, path: spec-audit/selection/report.md }
    criteria: >-
      In the "Summary of issues" table at the end of the report: rows are grouped by priority in the order P1, P2, P3,
      Done (an empty priority may be absent); each row has a mitigation or solution; each effort is either a range in
      person-days with a stated basis, "not estimated", or "—" for rows marked Done; the errors the audit fixed appear
      as Done. Judge only that table and the totals line under it.
