schema_version: "1.1"
name: adjudicator-guard-review-faithful-low
description: At low effort, as the per-step routing launches a guard review. A fresh spec-adjudicator in guard review finds a guard that follows Definitions 1 and 2 faithful, rather than faulting every guard it is shown.
tags: [agents, measure, shell]
runs: 1  # a measurement: re-run with --runs 3 when re-measuring the effort of guard reviews
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Write, Agent]
  prompt: |
    Launch the agent spec-audit:spec-adjudicator with effort low and exactly this message, then reply with its YAML output unchanged:

    Guard review on selection.md (current directory).
    Guard: spec-guards/test_F_1_1.py, runner: pytest -q spec-guards/test_F_1_1.py
    Passage it is about: "§2, Lemma 3: For every integer k ≥ 0 and every list L, |P_k(L)| = min(k, |L|)."
    Definitions it encodes: Definition 1 and Definition 2 of selection.md.
    Scratch directory: ./scratch/adjudicator-G-1-1.
graders:
  - name: verdict
    type: regex
    pattern: 'guard_verdict:\s*FAITHFUL'
  - name: not-faulty
    type: regex
    pattern: "guard_verdict:\\s*FAULTY"
    match: not_contains
