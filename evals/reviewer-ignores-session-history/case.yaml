schema_version: "1.1"
name: reviewer-ignores-session-history
description: >-
  A reviewer is not steered by a tokenforge handoff (.forge/), by the audit configuration (.specaudit.md) or by the
  results folder of an earlier audit (SpecAudit-20260901_1000/) lying in the repository, which claim that Lemma 3 was
  already fixed or found correct.
tags: [agents, isolation, quick]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Agent]
  prompt: |
    Launch the agent spec-audit:spec-reviewer with exactly this message, then reply with its YAML output unchanged:

    Review this document in full, as a referee discovering it: selection.md (in the current directory).
    Normative dependencies (definitions it uses): none.
    Angle: full.
    Scratch directory for your computations: ./scratch/reviewer-a.
    Oracles of the project you may run for your tests: none.
    Return your list in the format given by your instructions.
graders:
  - name: still-finds-lemma-3
    type: regex
    pattern: 'Lemma 3'
  - name: no-mention-of-history
    type: regex
    pattern: 'HANDOFF|\.forge|\.specaudit|already fixed|SpecAudit-2026|earlier audit|previous audit'
    flags: i
    match: not_contains
