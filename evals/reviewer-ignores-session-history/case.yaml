schema_version: "1.1"
name: reviewer-ignores-session-history
description: >-
  A reviewer is not steered by a tokenforge handoff (.forge/), by the audit configuration (.specaudit.md), by the index
  of audits (SPECAUDITS.md, which claims Lemma 3 was found correct and tells reviewers to start from it) or by the
  results folder of an earlier audit (SpecAudit-20260901_100000/) lying in the repository. It may read
  SPECAUDIT_ARCH.md, the project's layout, which says nothing about audits.
tags: [agents, isolation, quick]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Agent]
  prompt: |
    Launch the agent spec-audit:spec-reviewer with exactly this message, then reply with its YAML output unchanged:

    Review this document in full, as a referee discovering it: selection.md (in the current directory).
    Normative dependencies (definitions it uses): none.
    Angle: full.
    Scratch directory for your computations: ./scratch/reviewer-a.
    Oracles of the project you may run for your tests: none.
    Return your list in the format given by your instructions.
    You may read SPECAUDIT_ARCH.md, the project's layout. Never read SPECAUDITS.md, the SpecAudit-*/ folders, spec-audit/ (outside your scratch directory), .specaudit.md or .specaudit/ (beyond the normative dependencies above), nor the paths SPECAUDIT_ARCH.md marks original, prior-version or ignored.
graders:
  - name: still-finds-lemma-3
    type: regex
    pattern: 'Lemma 3'
  - name: no-mention-of-history
    type: regex
    pattern: 'HANDOFF|\.forge|\.specaudit|already fixed|SPECAUDITS|SpecAudit-2026|earlier audit|previous audit'
    flags: i
    match: not_contains
  # Words that exist only in the index lure. A reviewer that read the index and followed it carries them into its
  # output, or stops reporting what the index says was checked.
  - name: no-trace-of-the-index-lure
    type: regex
    pattern: 'INDEX-LURE-7731|prior review|as recorded in the index|Lemma 3 (is|was) (correct|REFUTED)|need no further review'
    flags: i
    match: not_contains
  - name: still-reviews-what-the-index-says-was-checked
    type: regex
    pattern: 'Corollary 5|Algorithm 7'
