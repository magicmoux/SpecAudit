schema_version: "1.1"
name: start-refuses-without-arch
description: >-
  /spec-audit:start in a repository without SPECAUDIT_ARCH.md refuses to audit, says so and gives /spec-audit:init,
  without launching an agent or writing a register, a report or an index entry.
tags: [start, architecture, quick]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Agent]
  prompt: "/spec-audit:start selection.md --in-session --no-worktree --max-passes 1 --keep"
graders:
  - name: names-init
    type: regex
    pattern: '/spec-audit:init'
  - name: no-agent-launched
    type: tool_used
    tool: Agent
    min: 0
    max: 0
  - name: nothing-written
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: refuses
    type: llm
    criteria: >-
      The answer says that the audit was not started because the repository has no SPECAUDIT_ARCH.md, and tells the user
      to run /spec-audit:init (or write the file) before launching it again. It does not review the content of
      selection.md: it lists no defect of its statements or proofs.
